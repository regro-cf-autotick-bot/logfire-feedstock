{% set name = "logfire" %}
{% set version = "5.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/logfire-{{ version }}.tar.gz
  sha256: b3be3e29b14147fdf8a0e3ca3aa5b3e8b96d5e2539d6ea8c7e5eecec2dd40490

build:
  entry_points:
    - logfire = logfire.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - hatchling
    - pip
  run:
    - logfire-sdk ==5.3.0
    - opentelemetry-api >=1.39.0,<1.46.0
    - opentelemetry-semantic-conventions >=0.60b0,<0.67b0
    - requests >=2.31.0
    - typing_extensions >=4.13.0
    - executing >=2.0.1
    - python >=3.8
    - opentelemetry-sdk >=1.39.0,<1.46.0
    - opentelemetry-exporter-otlp-proto-http >=1.39.0,<1.46.0
    - opentelemetry-instrumentation >=0.41b0,<0.67b0
    - rich >=13.4.2
    - protobuf >=4.23.4
    - typing-extensions >=4.1.0
    - tomli >=2.0.1

test:
  imports:
    - logfire
  commands:
    - pip check
    - logfire --help
  requires:
    - pip

about:
  home: https://github.com/pydantic/logfire
  dev_url: https://github.com/pydantic/logfire
  doc_url: https://docs.pydantic.dev/logfire
  summary: The best Python observability tool! 🪵🔥
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Kludex
    - samuelcolvin
